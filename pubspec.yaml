name: tip_out
description: Tip Out — a tip-out calculator for bartenders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  share_plus: ^10.0.0
  open_filex: ^4.4.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Generates the launcher icons for every platform from one source image.
# Regenerate after changing the artwork with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"